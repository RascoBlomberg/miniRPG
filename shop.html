<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="shop.css">
</head>
<body>

<img src="assets\shopREF.jpg" style="width:100vw; height:100vh; z-index: -1;">

<div id="dialogBox" class="dialog-box">
    <p id="dialogText">Första meddelandet</p>
    <button id="nextBtn">Nästa</button>
</div>

<script>

window.addEventListener("DOMContentLoaded", LSloadProgress);

// Dialogmeddelanden
const messages1 = [
    "Halt! För att komma in i butiken behöver du betala ett arvode på 200 guldmynt",
    "Hmmmm, verkar som du inte har tillräckligt",
    "Gå ner till farmen och odla lite och kom tillbaka när du har råd.",
    "Hej då!",
];

const messages2 = [
    "Ah du är tillbaka",
    "Få se nu, har du tillräckligt med dig?",
    "195, 196, 197, 198, 199, 200, ah perfekt",
    "Varsågod vidare",
];

// Progress-array, index enligt din kommentar:
// 0 - moneyValue
// 1 - start tutorial panel
// 2 - shop tutorial panel 1
// 3 - farm tutorial panel
// 4 - shop tutorial panel 2

let progress = [0, false, false, false, false];

function LSloadProgress() {
    if (!localStorage.progress) return;
    progress = JSON.parse(localStorage.progress);
}

function LSsaveProgress() {
    localStorage.progress = JSON.stringify(progress);
}

let dialogVisited = progress[2] === true;

let messages = dialogVisited ? messages2 : messages1;

let currentMessage = 0;

const dialogText = document.getElementById("dialogText");
const nextBtn = document.getElementById("nextBtn");

if (!dialogVisited && messages.length > 0) {
    dialogText.textContent = messages[currentMessage];
} else if (dialogVisited) {
    const moneyValue = progress[0] || 0;
    messages[2] = `Följande belopp har du: ${moneyValue}, ah perfekt`;
    dialogText.textContent = messages[currentMessage];
}


nextBtn.addEventListener("click", () => {
    currentMessage++;

    if (currentMessage < messages.length) {
        dialogText.textContent = messages[currentMessage];
    } else {
        progress[2] = true;
        LSsaveProgress();
        window.location.href = "loading.html";
    }
});


</script>
</body>
</html>
